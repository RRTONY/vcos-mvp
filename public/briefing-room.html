<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<!-- VCoS: replaces the Claude Artifact database + viewer identity with /api/briefing -->
<script src="/briefing-room-adapter.js"></script>
</head>
<body>
<title>RampRate Briefing Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concept: an executive command centre. Deep navy header with one gold accent line, quiet slate neutrals, and status colour used only where it carries meaning. One light theme by request. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#0F1B33; --body:#2B3750; --muted:#5B6780; --line:#DCE1EC; --soft:#EDF0F6; --soft2:#F7F8FB;
  --navy:#0F1B33; --navy2:#1C2E55; --on-navy:#FFFFFF; --on-navy-dim:#B9C4DD;
  --gold:#C9A24B; --accent:#2747C9; --accent-soft:#E4EAFB; --accent-ink:#1A2F8F;
  --red:#B8322B; --red-soft:#FCE9E7; --red-ink:#8C211B;
  --amber:#B7791F; --amber-soft:#FDF1D8; --amber-ink:#7A4E0E;
  --green:#1C7C54; --green-soft:#DFF3E8; --green-ink:#115C3C;
  --slate:#64708A; --slate-soft:#E8EBF1; --slate-ink:#434E66;
  --sh1:0 1px 2px rgba(15,27,51,.06),0 2px 6px -2px rgba(15,27,51,.08);
  --sh2:0 2px 4px rgba(15,27,51,.06),0 12px 28px -12px rgba(15,27,51,.22);
  --sh3:0 4px 8px rgba(15,27,51,.08),0 22px 44px -16px rgba(15,27,51,.32);
  --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font:16px/1.55 var(--font-body);padding-block:0 80px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);color:var(--ink);line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:3px solid #7C93F5;outline-offset:2px}
.in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.band{background:radial-gradient(1200px 400px at 85% -20%,#2A4380 0,transparent 60%),linear-gradient(135deg,var(--navy),var(--navy2));color:var(--on-navy);padding-block:16px 30px;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),#E9D18F 40%,var(--gold))}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#E9D18F,var(--gold));color:var(--navy);font-size:15px;font-weight:800;box-shadow:0 4px 10px -2px rgba(0,0,0,.35)}
.brand span{font-weight:600;color:var(--on-navy-dim);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.band select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:var(--on-navy);border-radius:10px;padding:9px 12px;max-width:100%;min-width:0}
.band select option{color:var(--ink)}
.hero{padding-top:26px;display:grid;gap:12px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;color:#fff;letter-spacing:-.02em}
.hero h1 small{font-size:.5em;font-weight:600;color:var(--on-navy-dim);margin-left:12px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14.5px;color:var(--on-navy-dim)}
.meta b{color:#fff;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
.chip.warn{background:var(--gold);border-color:var(--gold);color:#241A02}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(#fff,#F5F7FB);border:1px solid #CFD6E5;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink);box-shadow:var(--sh1);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh2);border-color:#AEB9D3}
.btn:active{transform:translateY(0);box-shadow:var(--sh1)}
.band .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff;box-shadow:none}
.band .btn:hover{background:rgba(255,255,255,.2);box-shadow:none}
.btn.on,.band .btn.on{background:linear-gradient(#E9D18F,var(--gold));border-color:var(--gold);color:#241A02}
.btn.primary{background:linear-gradient(180deg,#3558DB,var(--accent-ink));border-color:var(--accent-ink);color:#fff;box-shadow:0 1px 2px rgba(15,27,51,.2),0 8px 16px -8px rgba(39,71,201,.7)}
.btn.primary:hover{box-shadow:0 2px 4px rgba(15,27,51,.2),0 12px 22px -8px rgba(39,71,201,.8)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);box-shadow:none;transform:none}
.btn.danger{color:var(--red-ink)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}

/* tabs */
.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:15px 16px 12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:color .12s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .n{margin-left:8px;font-size:12px;font-weight:700;background:var(--soft);color:var(--slate-ink);padding:1px 8px;border-radius:99px}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent-ink)}
.tab .n.alert{background:var(--red-soft);color:var(--red-ink)}
.panel{padding-top:28px}
.panel[hidden]{display:none}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 15px;text-align:left;display:grid;gap:4px;box-shadow:var(--sh1);position:relative;overflow:hidden;cursor:default;transition:transform .12s ease,box-shadow .12s ease}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--slate))}
button.kpi{cursor:pointer}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
button.kpi[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.kpi b{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;font-weight:600;color:var(--muted)}
.kpi.red{--c:var(--red)}.kpi.amber{--c:var(--amber)}.kpi.green{--c:var(--green)}.kpi.blue{--c:var(--accent)}.kpi.slate{--c:var(--slate)}.kpi.navy{--c:var(--navy)}

/* panels */
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:30px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh1);padding:20px 22px;display:grid;gap:12px;align-content:start;min-width:0}
.pc h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.pc h2 .count{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--slate-soft);color:var(--slate-ink)}
.pc h2 .count.red{background:var(--red-soft);color:var(--red-ink)}
.pc h2 .count.blue{background:var(--accent-soft);color:var(--accent-ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;border-radius:12px;background:var(--soft2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:background .12s,box-shadow .12s}
.row:hover{background:#fff;box-shadow:var(--sh2)}
.row .t{font-weight:700;color:var(--ink);font-size:15.5px}
.row .s{grid-column:1/-1;font-size:14.5px;color:var(--muted);line-height:1.4}
.age{font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--red-ink);background:var(--red-soft);padding:2px 10px;border-radius:99px;align-self:start;white-space:nowrap}
.age.amber{color:var(--amber-ink);background:var(--amber-soft)}
.score{display:flex;flex-wrap:wrap;gap:8px}
.score span{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;background:var(--soft);padding:4px 12px 4px 4px;border-radius:99px;color:var(--ink)}
.score b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:99px;background:var(--red);color:#fff;font-size:12.5px;padding:0 6px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.toolbar input[type=search]{flex:1 1 240px;max-width:380px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--sh1)}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 8px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--sh1);transition:box-shadow .12s}
.fchip:hover{box-shadow:var(--sh2)}
.fchip.plain{padding-left:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:700;flex:none}
.avs{display:flex;margin-left:auto}
.avs .av{margin-left:-7px;border:2px solid #fff}
.avs .av:first-child{margin-left:0}

/* tiles */
.sechead{display:flex;align-items:baseline;gap:12px;margin:6px 0 16px}
.sechead h2{font-size:26px;font-weight:800}
.sechead .count{font-weight:700;color:var(--muted)}
.sechead .btn{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin-bottom:36px}
.tile{display:flex;flex-direction:column;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px 22px;cursor:pointer;box-shadow:var(--sh1);transition:transform .14s ease,box-shadow .14s ease;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh3)}
.h-noresponse{--c:var(--red)}.h-stuck{--c:var(--amber)}.h-decision{--c:var(--accent)}.h-moving{--c:var(--green)}.h-quiet{--c:var(--slate)}
.t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.noresponse{background:var(--red-soft);color:var(--red-ink)}
.pill.stuck{background:var(--amber-soft);color:var(--amber-ink)}
.pill.decision{background:var(--accent-soft);color:var(--accent-ink)}
.pill.moving{background:var(--green-soft);color:var(--green-ink)}
.pill.quiet{background:var(--slate-soft);color:var(--slate-ink)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ink);color:#fff}
.tag.upd{background:var(--accent-soft);color:var(--accent-ink)}
.tag.urg{background:var(--red);color:#fff}
.tile h3{font-size:21px;font-weight:800}
.tile .head{margin:0;font-size:16px;line-height:1.45;color:var(--ink);font-weight:500}
.mini{display:grid;gap:8px;margin:0}
.mini div{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;font-size:14.5px;line-height:1.4}
.mini dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.mini dd{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .stk dt{color:var(--amber-ink)}
.tnote{background:var(--accent-soft);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--accent-ink)}
.tnote b{margin-right:4px}
.t-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:13.5px;font-weight:600;color:var(--muted);align-items:center}
.t-foot .em{color:var(--red-ink);background:var(--red-soft);padding:2px 9px;border-radius:99px}
.t-foot .more{margin-left:auto;color:var(--accent-ink)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:26px;color:var(--muted);background:var(--surface);font-size:16px}
.empty b{color:var(--ink)}
details.about{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--sh1)}
details.about summary{cursor:pointer;font-weight:700;font-size:15.5px;color:var(--ink)}
details.about p{color:var(--muted);max-width:75ch}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(12,20,40,.7);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:800px;margin:auto;overflow:hidden;box-shadow:0 40px 90px -24px rgba(0,0,0,.6)}
.sh-head{padding:22px 26px 18px;display:grid;gap:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;position:relative}
.sh-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.sh-head h2{color:#fff;font-size:clamp(26px,4vw,34px);font-weight:800}
.sh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-top .spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:22px;line-height:1}
.iconbtn:hover{background:rgba(255,255,255,.26)}
.owners{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--on-navy-dim);flex-wrap:wrap}
.owners .av{border:2px solid rgba(255,255,255,.7)}
.sh-body{padding:8px 26px 28px;display:grid;gap:22px}
.sh-body section{display:grid;gap:8px}
.latest{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.3;margin-top:16px;color:var(--ink)}
.sh-body p{margin:0;font-size:16.5px;line-height:1.6;max-width:68ch}
.sh-body ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.sh-body li{font-size:16px;padding:10px 14px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;line-height:1.45}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gbox{border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start;border:1px solid var(--line);background:var(--soft2)}
.gbox .label{color:var(--muted)}
.gbox p{font-size:15.5px}
.gbox.done{background:var(--green-soft);border-color:transparent}.gbox.done .label{color:var(--green-ink)}
.gbox.stk{background:var(--amber-soft);border-color:transparent}.gbox.stk .label{color:var(--amber-ink)}
.gbox.nxt{background:var(--accent-soft);border-color:transparent}.gbox.nxt .label{color:var(--accent-ink)}
.slackbox{border-left:4px solid var(--gold);background:#FBF6E8;border-radius:0 12px 12px 0;padding:12px 16px}
.emrow{display:grid;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft2)}
.emrow .top2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.emrow b{color:var(--ink)}
.notebox{background:var(--accent-soft);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.notebox textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #9CB0F0;border-radius:12px;padding:12px 14px;background:#fff;font-size:16.5px;line-height:1.5}
.notebox .rowx{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notebox .rowx select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.notebox .when{font-size:13.5px;color:var(--accent-ink);font-weight:600}
.notebox .shown{font-size:16.5px;white-space:pre-wrap}
.srcs{display:flex;flex-wrap:wrap;gap:8px}
.srcs a{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;text-decoration:none;font-weight:600;font-size:14px;color:var(--accent-ink);box-shadow:var(--sh1)}
.srcs a:hover{border-color:var(--accent)}
a{color:var(--accent-ink);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;padding:14px 26px;border-top:1px solid var(--line);background:var(--soft2)}
.fields{display:grid;gap:12px}
.fields label{display:grid;gap:4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.ef{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;resize:vertical;color:var(--ink);font-weight:400;font-size:15.5px}
textarea.ef{min-height:74px}

/* audit */
.agrid{display:grid;gap:14px;margin-bottom:34px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);padding:18px 20px 16px 24px;display:grid;gap:12px;position:relative;overflow:hidden}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.acard.s-noreply{--c:var(--red)}.acard.s-late{--c:var(--amber)}.acard.s-replied{--c:var(--accent)}.acard.s-handled{--c:var(--green)}
.ahead{display:flex;gap:10px 14px;align-items:flex-start;flex-wrap:wrap}
.ahead h3{font-size:20px;font-weight:800;flex:1 1 260px}
.ahead .sub{font-size:14.5px;color:var(--muted);font-weight:500;display:block;margin-top:3px}
.abody{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 22px}
.abody div{display:grid;gap:3px;align-content:start}
.abody p{margin:0;font-size:15.5px;line-height:1.5}
.afoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stbadge{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap}
.stbadge.noreply{background:var(--red-soft);color:var(--red-ink)}.stbadge.late{background:var(--amber-soft);color:var(--amber-ink)}.stbadge.replied{background:var(--accent-soft);color:var(--accent-ink)}.stbadge.handled{background:var(--green-soft);color:var(--green-ink)}
.scroll{overflow-x:auto;background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh1)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;background:var(--soft)}
td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:top;font-size:15.5px}
td.when{white-space:nowrap;font-weight:600;color:var(--accent-ink)}
td.name{font-weight:700;color:var(--ink)}
td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
tr.dayrow td{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;padding:8px 16px;font-size:13.5px}
.h2{font-family:var(--font-display);font-size:24px;font-weight:800;margin:6px 0 14px;display:flex;gap:12px;align-items:center;color:var(--ink)}
.h2 .btn{margin-left:auto}

/* decisions, changes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px;box-shadow:var(--sh1)}
.card.amber{background:var(--amber-soft);border-color:transparent}
.card .who{font-size:13.5px;font-weight:700;color:var(--accent-ink)}
.card .src{font-size:13.5px;color:var(--muted)}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px;margin-bottom:12px;box-shadow:var(--sh1)}
.dc h3{font-size:19px}
.dc .was{color:var(--muted);text-decoration:line-through;font-size:14.5px}
.dc .now{font-size:16px}
.diffgrp{margin-bottom:26px}
.note{color:var(--muted);font-size:14.5px;max-width:70ch}

/* questions */
.qwrap{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
.qform{display:grid;gap:12px;position:sticky;top:72px;background:var(--surface);border-radius:18px;padding:20px;border:1px solid var(--line);box-shadow:var(--sh2)}
.qform label{display:grid;gap:5px;font-size:13.5px;font-weight:600;color:var(--muted)}
.qperson{margin-bottom:24px}
.qperson h3{font-size:21px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;margin-bottom:10px;box-shadow:var(--sh1)}
.q p{margin:0;font-size:16.5px}
.q .topic{font-size:13.5px;font-weight:700;color:var(--accent-ink)}
.qtags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .st{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber-ink)}
.q .st.done{background:var(--green-soft);color:var(--green-ink)}
.q .st.late{background:var(--red-soft);color:var(--red-ink)}
.ans{background:var(--accent-soft);border-radius:12px;padding:11px 14px;font-size:16px}
.ans .label{color:var(--accent-ink)}

/* history */
.hsearch{margin-bottom:24px;display:grid;gap:8px}
.hsearch input{padding:13px 16px;font-size:16.5px;border-radius:14px;box-shadow:var(--sh1)}
.hit{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px 18px;padding:14px 18px;background:var(--surface);border-radius:14px;margin-bottom:8px;align-items:start;border:1px solid var(--line);box-shadow:var(--sh1)}
.hit .k{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hit .t{font-weight:700;font-size:16.5px;color:var(--ink)}
.hit .s{color:var(--muted);font-size:14.5px;margin-top:2px}
mark{background:var(--amber-soft);color:var(--ink);padding:0 3px;border-radius:3px}
.hist{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:6px 22px;padding:18px;background:var(--surface);border-radius:16px;margin-bottom:10px;align-items:start;border:1px solid var(--line);box-shadow:var(--sh1)}
.hist .d{font-weight:800;font-family:var(--font-display);font-size:19px;color:var(--ink)}
.hist h3{font-size:19px}
.hist .m{color:var(--muted);font-size:14.5px;margin-top:4px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:600;z-index:70;max-width:90vw;box-shadow:var(--sh3)}

/* present mode */
body.present{font-size:19px}
body.present .tile h3{font-size:25px}
body.present .tile .head{font-size:19px}
body.present .mini div{font-size:17px}
body.present .grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
body.present .editonly,body.present .qform{display:none}
body.present .qwrap{grid-template-columns:1fr}
body.present .in{max-width:1440px}

@media (max-width:900px){.cols2{grid-template-columns:1fr}}
@media (max-width:820px){
  .qwrap{grid-template-columns:1fr}.qform{position:static}
  .hit,.hist{grid-template-columns:1fr}
  .sh-head,.sh-body,.nav{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div></div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
const TEAM=['Josh','Alex','Rob','Sam','Ben','Kim','Darryl'];
const COLORS={Josh:'#2F57D0',Alex:'#1C7C54',Rob:'#B8562A',Sam:'#6B49B8',Ben:'#13808C',Kim:'#B03A7F',Darryl:'#56627F',Tony:'#0F1B33',Admin:'#B03A7F'};
const TABS=['overview','audit','decisions','log','changes','questions','history'];
const LEGACY={clients:'overview',relationships:'overview'};
const HEALTH={noresponse:{label:'Not responded',rank:0},stuck:{label:'Stuck',rank:1},decision:{label:'Needs Tony',rank:2},moving:{label:'Moving',rank:3},quiet:{label:'Quiet',rank:4}};
const AUD={noreply:'No real reply',late:'Late or acknowledged only',replied:'Replied since the audit',handled:'Handled'};
const AUDORDER=['noreply','late','replied','handled'];
const S={db:null,canWrite:true,canAnswer:false,isAdmin:false,att:{},edit:false,present:false,mid:null,tab:'overview',status:'all',owner:'All',search:'',openId:null,vis:[],
  meetings:[],entries:[],log:[],waiting:[],audit:[],questions:[],prevEntries:[],prevWaiting:[],prevLoaded:false,prevMid:null,diff:{state:'first'},
  confirm:null,pending:false,hq:'',all:null,allAt:0,allBusy:false,who:'Josh'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
S.who=store.get('br.who')||'Josh';
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3000)}
function fmtDay(iso){if(!iso)return '';const p=String(iso).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtPT(iso){return new Date(iso).toLocaleString('en-US',{timeZone:'America/Los_Angeles',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT'}
function cur(){return S.meetings.find(m=>m.id===S.mid)||null}
const none=t=>!t||/^\s*(none|no thread|no meeting|see brief)/i.test(t);
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
const URG_RE=/overdue|unanswered|no (written )?(reply|answer|status)|not (yet )?sent|stalled|unsent|still unresolved/i;
function urgency(e){if(e.urgency==='high'||e.urgency==='watch'||e.urgency==='normal')return e.urgency;return URG_RE.test((e.brief||'')+' '+(e.emails||''))?'watch':'normal'}
function health(e){if(HEALTH[e.health])return e.health;const u=urgency(e);return u==='normal'?'moving':'stuck'}
function headline(e){if(e.headline)return e.headline;if(e.urgentReason)return e.urgentReason;const b=String(e.brief||'');const i=b.search(/[.!?]\s/);const s=i>0?b.slice(0,i+1):b;return s.length>120?s.slice(0,117)+'…':s}
function ownerNames(o){return TEAM.concat(['Tony']).filter(n=>new RegExp('\\b'+n+'\\b').test(o||''))}
const av=n=>`<span class="av" style="background:${COLORS[n]||'#56627F'}" title="${esc(n)}">${esc(n[0])}</span>`;
function srcLinks(arr){return (arr||[]).filter(x=>safeUrl(x.url)).map(x=>`<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.label||'Source')}</a>`).join('')}
function parseSrc(t){return String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf('|');const lab=i>=0?l.slice(0,i).trim():'Source',u=safeUrl(i>=0?l.slice(i+1):l);return u?{label:lab||'Source',url:u}:null}).filter(Boolean)}
const meetItems=e=>none(e.meetings)?[]:String(e.meetings).split(' · ').map(s=>s.trim()).filter(Boolean);
const openAudit=e=>S.audit.filter(a=>a.entryId===e.id&&(a.status==='noreply'||a.status==='late'));
const ageTxt=a=>a.ageDays!=null&&a.ageDays!==''?a.ageDays+(Number(a.ageDays)===1?' day':' days'):'';

/* ---------- data ---------- */
let unsubs=[];
function sub(coll,key,mid){
  return S.db.collection(coll).where('meetingId','==',mid).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key==='prevEntries')S.prevLoaded=true;renderSoon()},e=>toast('Could not load '+coll+' ('+e.code+')'));
}
function prevMeeting(){const i=S.meetings.findIndex(m=>m.id===S.mid);return i>=0?(S.meetings[i+1]||null):null}
function watchMeeting(){
  unsubs.forEach(u=>u());unsubs=[];S.entries=[];S.log=[];S.waiting=[];S.audit=[];S.prevEntries=[];S.prevWaiting=[];S.prevLoaded=false;
  if(!S.db||!S.mid){renderAll();return}
  unsubs=[sub('entries','entries',S.mid),sub('log','log',S.mid),sub('waiting','waiting',S.mid),sub('audit','audit',S.mid)];
  const pm=prevMeeting();S.prevMid=pm?pm.id:null;
  if(pm)unsubs.push(sub('entries','prevEntries',pm.id),sub('waiting','prevWaiting',pm.id));
}
function selectMeeting(id){S.mid=id;S.openId=null;store.set('br.mid',id);watchMeeting();renderAll()}
async function upd(coll,id,data){try{await S.db.collection(coll).doc(id).update(data);return true}catch(e){toast('Not saved: '+(e&&e.message||'try again'));return false}}
async function setDoc(coll,id,data){try{await S.db.collection(coll).doc(id).set(data)}catch(e){toast('Not saved: '+(e&&e.message||'try again'))}}
async function delDoc(coll,id){try{await S.db.collection(coll).doc(id).delete()}catch(e){toast('Not deleted: '+(e&&e.message||'try again'))}}
const nextOrder=a=>a.reduce((m,x)=>Math.max(m,x.order||0),0)+1;
const uid=()=>Math.random().toString(36).slice(2,9);

function computeDiff(){
  const pm=prevMeeting();
  if(!pm)return {state:'first'};
  if(!S.prevLoaded)return {state:'loading',pm};
  if(!S.prevEntries.length)return {state:'nobase',pm};
  const pk=new Map(S.prevEntries.map(e=>[e.kind+'|'+norm(e.name),e]));
  const by={},nw=[],up=[],same=[];
  S.entries.forEach(e=>{const p=pk.get(e.kind+'|'+norm(e.name));
    if(!p){by[e.id]={state:'new'};nw.push(e);return}
    const fields=['brief','meetings','emails'].filter(f=>norm(e[f])!==norm(p[f]));
    if(fields.length){by[e.id]={state:'upd',fields,prev:p};up.push(e)}else{by[e.id]={state:'same'};same.push(e)}});
  const ck=new Set(S.entries.map(e=>e.kind+'|'+norm(e.name)));
  const dropped=S.prevEntries.filter(p=>!ck.has(p.kind+'|'+norm(p.name)));
  const pw=new Set(S.prevWaiting.map(w=>norm(w.item))),cw=new Set(S.waiting.map(w=>norm(w.item)));
  return {state:'ok',pm,by,nw,up,same,dropped,wNew:S.waiting.filter(w=>!pw.has(norm(w.item))),wGone:S.prevWaiting.filter(w=>!cw.has(norm(w.item)))};
}

/* ---------- rendering ---------- */
let rt=null;
function typing(){const a=document.activeElement;return !!(a&&a.classList&&a.classList.contains('ef')&&!a.closest('#qform'))}
function renderSoon(){if(typing()){S.pending=true;return}clearTimeout(rt);rt=setTimeout(renderAll,30)}
document.addEventListener('focusout',()=>{if(S.pending){S.pending=false;setTimeout(()=>{if(!typing())renderAll()},120)}});
const qCount=mid=>S.questions.filter(q=>q.meetingId===mid);

function renderHero(){
  const m=cur();const h=$('#hero');
  if(!m){h.innerHTML=`<div class="eyebrow">CEO Command Centre</div><h1>${S.db?'No meeting record yet':'Sign in to open the briefing'}</h1><p class="meta">${S.db?'The next record appears here on Wednesday and Friday.':'This page reads shared data and needs a signed-in viewer with access.'}</p>`;return}
  const due=m.questionsDue?new Date(m.questionsDue).getTime():0,left=due-Date.now();
  let chip='';
  if(due){if(left>0){const hh=Math.floor(left/36e5),d=Math.floor(hh/24);chip=`<span class="chip warn">Questions close in ${d>=1?d+' d '+(hh%24)+' h':hh+' h '+Math.floor(left%36e5/6e4)+' min'}</span>`}else chip=`<span class="chip">Questions closed</span>`}
  h.innerHTML=`<div class="eyebrow">CEO Command Centre · ${esc(m.kind||'Team meeting')} record</div>
   <h1>${esc(m.title||fmtDay(m.date))}<small>${esc(fmtDay(m.date))}</small></h1>
   <div class="meta"><span>Covers <b>${esc(fmtDay(m.periodStart))} to ${esc(fmtDay(m.periodEnd))}</b></span>${m.dataThrough?`<span>Data through <b>${esc(fmtPT(m.dataThrough))}</b></span>`:`<span>Prepared <b>${esc(fmtDay(m.preparedAt))}</b></span>`}${m.questionsDue?`<span>Questions due <b>${esc(fmtPT(m.questionsDue))}</b></span>`:''}${chip}</div>`;
}
function renderPick(){
  $('#mpick').innerHTML=S.meetings.map(m=>`<option value="${esc(m.id)}"${m.id===S.mid?' selected':''}>${esc(fmtDay(m.date))}: ${esc(m.title||'Team meeting')}</option>`).join('')||'<option>No records</option>';
}
function renderTabs(){
  const m=S.mid,D=S.diff,chg=D.state==='ok'?D.nw.length+D.up.length:null;
  const nr=S.audit.filter(a=>a.status==='noreply').length;
  const tabs=[['overview','Command Centre',null],['audit','Email audit',S.audit.length?nr:null,true],['decisions','Decisions',S.waiting.length],['log','Meeting log',S.log.length],['changes','What changed',chg],['questions','Questions for Tony',m?qCount(m).length:0],['history','History',S.meetings.length]];
  $('#tabs').innerHTML=tabs.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}${t[2]!=null?`<span class="n${t[3]?' alert':''}">${t[2]}</span>`:''}</button>`).join('');
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+S.tab);
}

/* tile board */
function tileHTML(e){
  const h=health(e),ch=S.diff.by&&S.diff.by[e.id],names=ownerNames(e.owner),note=String(e.teamNote||'').trim(),mc=meetItems(e).length,oa=openAudit(e).length;
  return `<article class="tile h-${h}" tabindex="0" role="button" data-entry="${esc(e.id)}" aria-label="Open details for ${esc(e.name)}">
    <div class="t-top"><span class="pill ${h}">${HEALTH[h].label}</span>${urgency(e)==='high'?'<span class="tag urg">Urgent</span>':''}${ch&&ch.state==='new'?'<span class="tag">New</span>':ch&&ch.state==='upd'?'<span class="tag upd">Updated</span>':''}<span class="avs">${names.map(av).join('')}</span></div>
    <h3>${esc(e.name)}</h3>
    <p class="head">${esc(headline(e))}</p>
    ${(e.done||e.stuck)?`<dl class="mini">${e.done?`<div><dt>Done</dt><dd>${esc(e.done)}</dd></div>`:''}${e.stuck?`<div class="stk"><dt>Stuck</dt><dd>${esc(e.stuck)}</dd></div>`:''}</dl>`:''}
    ${note?`<div class="tnote"><b>Team update:</b>${esc(note)}</div>`:''}
    <div class="t-foot">${oa?`<span class="em">${oa} email${oa===1?'':'s'} open</span>`:''}<span>${mc} meeting${mc===1?'':'s'}</span><span class="more">Open</span></div>
  </article>`;
}
function ownerKeys(){return [...new Set(S.audit.map(a=>a.ownerKey).filter(Boolean))]}
function renderOverview(){
  const m=cur(),p=$('#p-overview');
  if(!m){p.innerHTML=`<div class="empty"><b>No record yet.</b> Claude adds the next one on Wednesday and Friday.</div>`;return}
  const all=S.entries;
  const cnt={noresponse:0,stuck:0,decision:0,moving:0,quiet:0};all.forEach(e=>cnt[health(e)]++);
  const nr=S.audit.filter(a=>a.status==='noreply'),late=S.audit.filter(a=>a.status==='late');
  const names=[...new Set(all.flatMap(e=>ownerNames(e.owner)))];
  if(S.owner!=='All'&&!names.includes(S.owner))S.owner='All';
  const q=norm(S.search);
  const ok=e=>(S.status==='all'||health(e)===S.status)&&(S.owner==='All'||ownerNames(e.owner).includes(S.owner))&&(!q||norm([e.name,e.owner,e.headline,e.brief,e.done,e.stuck,e.slack,e.next,e.meetings,e.emails,e.teamNote].join(' ')).includes(q));
  const rk=e=>HEALTH[health(e)].rank*10+(urgency(e)==='high'?0:urgency(e)==='watch'?1:2);
  const sorter=(a,b)=>rk(a)-rk(b)||(a.order||0)-(b.order||0);
  const cl=all.filter(e=>e.kind==='client'&&ok(e)).sort(sorter),re=all.filter(e=>e.kind==='relationship'&&ok(e)).sort(sorter);
  S.vis=[...cl,...re].map(e=>e.id);
  const kpi=(k,cls,label,n,st)=>st?`<button class="kpi ${cls}" data-status="${st}" aria-pressed="${S.status===st}"><b>${n}</b><span>${label}</span></button>`:`<div class="kpi ${cls}"><b>${n}</b><span>${label}</span></div>`;
  const needs=all.filter(e=>health(e)==='decision').sort((a,b)=>(a.order||0)-(b.order||0));
  const topNr=[...nr].sort((a,b)=>(Number(b.ageDays)||0)-(Number(a.ageDays)||0)).slice(0,5);
  const keys=ownerKeys().map(k=>[k,S.audit.filter(a=>a.ownerKey===k&&(a.status==='noreply'||a.status==='late')).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const sec=(title,kind,list)=>`<div class="sechead"><h2>${title}</h2><span class="count">${list.length}</span>${S.edit?`<button class="btn sm editonly" data-add="${kind}">Add ${kind}</button>`:''}</div>${list.length?`<div class="grid">${list.map(tileHTML).join('')}</div>`:`<div class="empty" style="margin-bottom:30px">Nothing matches the filters.</div>`}`;
  const chip=(k,l)=>`<button class="fchip plain" data-status="${k}" aria-pressed="${S.status===k}">${l}</button>`;
  p.innerHTML=`
   <div class="kpis">
     ${kpi('','navy','Clients and relationships',all.length)}
     ${kpi('','green','Moving',cnt.moving,'moving')}
     ${kpi('','amber','Stuck or not moving',cnt.stuck,'stuck')}
     ${kpi('','red','Not responded',cnt.noresponse,'noresponse')}
     ${kpi('','blue','Need Tony',cnt.decision,'decision')}
     ${S.audit.length?`<button class="kpi red" data-tab="audit"><b>${nr.length}</b><span>Client emails with no real reply</span></button>`:''}
   </div>
   <div class="cols2">
     <section class="pc"><h2>Needs Tony's decision <span class="count blue">${needs.length}</span></h2>
       ${needs.length?needs.slice(0,6).map(e=>`<button class="row" data-entry="${esc(e.id)}"><span class="t">${esc(e.name)}</span><span class="tag upd" style="align-self:start">${e.kind==='client'?'Client':'Relationship'}</span><span class="s">${esc(e.next||headline(e))}</span></button>`).join(''):`<div class="note">Nothing flagged for Tony on this record.</div>`}
       ${S.waiting.length?`<button class="btn sm" data-tab="decisions" style="justify-self:start">${S.waiting.length} item${S.waiting.length===1?'':'s'} waiting on Tony, see Decisions</button>`:''}
     </section>

async function saveNote(id){

   <div class="kpis"><div class="kpi blue"><b>${D.nw.length}</b><span>New</span></div><div class="kpi green"><b>${D.up.length}</b><span>Updated</span></div><div class="kpi amber"><b>${D.dropped.length}</b><span>Dropped</span></div><div class="kpi red"><b>${D.wNew.length}</b><span>New for Tony</span></div><div class="kpi slate"><b>${D.wGone.length}</b><span>Cleared for Tony</span></div></div>
   ${D.up.length?`<div class="diffgrp"><div class="h2">Updated</div>${D.up.map(e=>{const c=D.by[e.id];return `<div class="dc"><h3>${esc(e.name)}</h3>${c.fields.map(f=>`<div><div class="label">${lab[f]} now</div><div class="now">${esc(e[f])}</div><div class="label" style="margin-top:6px">Before</div><div class="was">${esc(c.prev[f])}</div></div>`).join('')}</div>`}).join('')}</div>`:''}
   ${D.nw.length?`<div class="diffgrp"><div class="h2">New</div>${D.nw.map(card).join('')}</div>`:''}
   ${D.dropped.length?`<div class="diffgrp"><div class="h2">In the last record, not in this one</div>${D.dropped.map(e=>`<div class="dc"><h3>${esc(e.name)}</h3></div>`).join('')}</div>`:''}
   ${(D.wNew.length||D.wGone.length)?`<div class="diffgrp"><div class="h2">Waiting on Tony</div>${D.wNew.map(w=>`<div class="dc"><span class="tag" style="width:max-content">New</span><div class="now">${esc(w.item)} <span class="note">(${esc(w.who)})</span></div></div>`).join('')}${D.wGone.map(w=>`<div class="dc"><span class="tag upd" style="width:max-content">Cleared</span><div class="was">${esc(w.item)}</div></div>`).join('')}</div>`:''}
   ${(!D.nw.length&&!D.up.length&&!D.dropped.length&&!D.wNew.length&&!D.wGone.length)?`<div class="empty"><b>No changes.</b> Every entry matches the earlier record.</div>`:''}`;
}

/* questions */
function renderQuestions(){
  const m=cur();
  const who=$('#qwho');if(!who.options.length){who.innerHTML=TEAM.map(n=>`<option>${n}</option>`).join('')+'<option>Other</option>';who.value=TEAM.includes(S.who)?S.who:'Josh'}
  $('#topics').innerHTML=S.entries.map(e=>`<option value="${esc(e.name)}">`).join('');
  [...$('#qform').elements].forEach(el=>el.disabled=!S.canWrite||!m);
  if(!S.canWrite)$('#qmsg').textContent=S.canAnswer?'You have view-only access. You can answer the questions below.':'You have view-only access. Ask a VCoS admin for edit access.';
  const qs=m?qCount(m.id):[];const box=$('#qlist');
  if(!qs.length){box.innerHTML=`<div class="empty"><b>No questions yet.</b> Everyone can add one or several. Tony answers them here before the meeting${m&&m.questionsDue?`; the list closes ${esc(fmtPT(m.questionsDue))}`:''}.</div>`;return}
  box.innerHTML=[...TEAM,'Other'].map(n=>{const mine=qs.filter(q=>(q.who||'Other')===n).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(!mine.length)return '';
    return `<div class="qperson"><h3>${TEAM.includes(n)?av(n):''}${n} <span class="note">${mine.length} question${mine.length>1?'s':''}</span></h3>${mine.map(q=>`<div class="q">
      <div class="qtags">${q.topic?`<span class="topic">${esc(q.topic)}</span>`:''}<span class="st ${q.status==='answered'?'done':''}">${q.status==='answered'?'Answered':'Open'}</span>${q.late?'<span class="st late">Late</span>':''}</div>
      <p>${esc(q.text)}</p>
      ${S.present?(q.answer?`<div class="ans"><span class="label">Tony</span><br>${esc(q.answer)}</div>`:''):
       `<label><span class="label">Tony's answer</span><textarea class="ef" rows="2" data-coll="questions" data-id="${esc(q.id)}" data-field="answer" placeholder="${(S.canWrite||S.canAnswer)?'Type the answer here':''}" ${(S.canWrite||S.canAnswer)?'':'readonly'}>${esc(q.answer||'')}</textarea></label>
        ${S.canWrite?`<div><button class="btn ghost danger sm" data-del="questions:${esc(q.id)}">${S.confirm==='questions:'+q.id?'Confirm delete':'Delete'}</button></div>`:''}`}
    </div>`).join('')}</div>`}).join('');
}

/* history + search */
async function loadAll(force){
  if(!S.db||S.allBusy)return;
  if(S.all&&!force&&Date.now()-S.allAt<60000)return;
  S.allBusy=true;
  try{const g=async c=>(await S.db.collection(c).get()).docs.map(d=>({id:d.id,...d.data()}));
    const [entries,log,questions,waiting,audit]=await Promise.all([g('entries'),g('log'),g('questions'),g('waiting'),g('audit')]);
    S.all={entries,log,questions,waiting,audit};S.allAt=Date.now()}
  catch(e){toast('Search data did not load ('+(e&&e.code||'error')+')')}
  S.allBusy=false;renderHits();
}
function snip(text,term){
  const t=String(text||'');const i=t.toLowerCase().indexOf(term);
  if(i<0)return esc(t.slice(0,150))+(t.length>150?'…':'');
  const a=Math.max(0,i-60),b=Math.min(t.length,i+term.length+110);
  return (a>0?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+term.length))+'</mark>'+esc(t.slice(i+term.length,b))+(b<t.length?'…':'');
}
function renderHits(){
  const box=$('#hres');if(!box)return;
  const q=norm(S.hq);
  if(q.length<2){box.innerHTML='';return}
  if(!S.all){box.innerHTML=`<div class="empty">Searching all records…</div>`;return}
  const terms=q.split(' ').filter(Boolean);
  const dateOf=mid=>(S.meetings.find(m=>m.id===mid)||{}).date||'';
  const hits=[];
  const test=txt=>{const n=norm(txt);return terms.every(t=>n.includes(t))};
  const best=txt=>{const n=String(txt||'').toLowerCase();return terms.find(t=>n.includes(t))||terms[0]};
  S.all.entries.forEach(e=>{const txt=[e.name,e.owner,e.headline,e.done,e.stuck,e.slack,e.next,e.brief,e.meetings,e.emails,e.urgentReason,e.teamNote].join(' \n ');if(test(txt)){const f=['teamNote','stuck','done','slack','brief','meetings','emails'].find(k=>norm(e[k]).includes(terms[0]))||'brief';hits.push({mid:e.meetingId,kind:e.kind==='client'?'Client':'Relationship',entry:e.id,title:e.name,text:e[f]||e.brief,term:best(e[f]||e.brief)})}});
  S.all.audit.forEach(a=>{const txt=[a.party,a.subject,a.owner,a.inbound,a.done,a.next].join(' ');if(test(txt))hits.push({mid:a.meetingId,kind:'Email audit',tab:'audit',title:a.party,text:(a.subject||'')+' · '+(a.done||''),term:best(txt)})});
  S.all.log.forEach(r=>{const txt=[r.when,r.meeting,r.attendees,r.outcome].join(' ');if(test(txt))hits.push({mid:r.meetingId,kind:'Meeting',tab:'log',title:r.meeting,text:(r.when||'')+' · '+(r.attendees||'')+' · '+(r.outcome||''),term:best(txt)})});
  S.all.questions.forEach(x=>{const txt=[x.who,x.topic,x.text,x.answer].join(' ');if(test(txt))hits.push({mid:x.meetingId,kind:'Question',tab:'questions',title:(x.who||'')+(x.topic?' on '+x.topic:''),text:x.text+(x.answer?' → '+x.answer:''),term:best(txt)})});
  S.all.waiting.forEach(w=>{const txt=[w.item,w.who,w.source].join(' ');if(test(txt))hits.push({mid:w.meetingId,kind:'For Tony',tab:'decisions',title:w.item,text:w.who+' · '+w.source,term:best(txt)})});
  hits.sort((a,b)=>dateOf(b.mid).localeCompare(dateOf(a.mid)));
  const recs=new Set(hits.map(h=>h.mid)).size;
  box.innerHTML=hits.length?`<p class="note" style="margin:0 0 10px">${hits.length} match${hits.length===1?'':'es'} across ${recs} record${recs===1?'':'s'}, newest first.</p>`+hits.slice(0,80).map(h=>`<div class="hit"><div class="k">${esc(fmtDay(dateOf(h.mid)))}<br>${h.kind}</div><div><div class="t">${esc(h.title)}</div><div class="s">${snip(h.text,h.term)}</div></div><button class="btn sm" data-hit="${esc(h.mid)}" data-tabto="${h.tab||'overview'}" data-entryto="${esc(h.entry||'')}">Open</button></div>`).join('')+(hits.length>80?`<p class="note">Showing the first 80. Narrow the search.</p>`:''):`<div class="empty"><b>No matches.</b> Try fewer or different words.</div>`;
}
function renderHistory(){
  const p=$('#p-history');
  if(!S.meetings.length){p.innerHTML=`<div class="empty"><b>No history yet.</b> Each Monday and Thursday record stays here after the meeting.</div>`;return}
  p.innerHTML=`<div class="hsearch"><div class="label">Search every past record</div><input class="ef" type="search" id="hq" placeholder="Client, person, topic, email subject" value="${esc(S.hq)}" aria-label="Search history"></div><div id="hres"></div>
  <div class="h2" style="margin-top:20px">All records</div>`+S.meetings.map(m=>{const qs=qCount(m.id);const links=srcLinks(m.sourceLinks);
    return `<div class="hist"><div class="d">${esc(fmtDay(m.date))}</div>
      <div><h3>${esc(m.title||'Team meeting')}${m.id===S.mid?' <span class="tag">Open now</span>':''}</h3>
      <div class="m">Covered ${esc(fmtDay(m.periodStart))} to ${esc(fmtDay(m.periodEnd))} · prepared ${esc(fmtDay(m.preparedAt))} · ${m.entryCount!=null?m.entryCount+' entries · ':''}${qs.length} question${qs.length===1?'':'s'}${qs.length?' ('+qs.filter(q=>q.status==='answered').length+' answered)':''}</div>
      ${m.summary?`<div class="m">${esc(m.summary)}</div>`:''}${links?`<div class="links srcs">${links}</div>`:''}</div>
      <div><button class="btn sm" data-open="${esc(m.id)}">Open record</button></div></div>`}).join('');
  const hq=$('#hq');
  if(hq){hq.addEventListener('input',()=>{S.hq=hq.value;if(norm(S.hq).length>=2)loadAll();renderHits()});renderHits()}
}

function renderAll(){
  S.pending=false;
  if(!S.mid&&S.meetings.length)S.mid=S.meetings[0].id;
  S.diff=computeDiff();
  renderPick();renderHero();renderTabs();
  renderOverview();renderAudit();renderDecisions();renderLog();renderChanges();renderQuestions();renderHistory();renderSheet();
  $('#bEdit').hidden=!S.isAdmin||!S.canWrite||S.present;$('#bPresent').hidden=!S.isAdmin&&!S.present;$('#bEdit').classList.toggle('on',S.edit);$('#bEdit').textContent=S.edit?'Done editing':'Edit data';
  $('#bPresent').classList.toggle('on',S.present);$('#bPresent').textContent=S.present?'Exit present':'Present';
  document.body.classList.toggle('present',S.present);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a,[data-entry]');if(!t)return;
  if(t.matches('a'))return;
  const d=t.dataset;
  if(d.close){closeSheet();return}
  if(d.step){const i=S.vis.indexOf(S.openId)+Number(d.step);if(S.vis[i]){S.openId=S.vis[i];renderSheet();$('#overlay').scrollTop=0}return}
  if(d.savenote){await saveNote(d.savenote);return}
  if(d.entry){if(S.tab!=='overview'&&S.tab!=='audit'&&!S.vis.includes(d.entry))S.vis=[d.entry];openEntry(d.entry);return}
  if(d.auditto){S.tab='audit';try{history.replaceState(null,'','#audit')}catch(_){}renderAll();setTimeout(()=>{const el=document.getElementById('a-'+d.auditto);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},60);return}
  if(d.tab){S.tab=d.tab;try{history.replaceState(null,'','#'+S.tab)}catch(_){}renderAll();window.scrollTo({top:0});return}
  if(d.status){S.status=(S.status===d.status&&d.status!=='all')?'all':d.status;renderAll();return}
  if(d.owner){S.owner=d.owner;renderAll();return}
  if(d.open){selectMeeting(d.open);S.tab='overview';renderAll();window.scrollTo({top:0});return}
  if(d.hit){selectMeeting(d.hit);S.tab=d.tabto||'overview';S.search='';S.status='all';S.owner='All';renderAll();window.scrollTo({top:0});if(d.entryto)setTimeout(()=>{if(S.entries.some(x=>x.id===d.entryto))openEntry(d.entryto)},400);return}
  if(d.del){const k=d.del;if(S.confirm!==k){S.confirm=k;renderAll();return}
    S.confirm=null;const i=k.indexOf(':');const coll=k.slice(0,i),id=k.slice(i+1);if(coll==='entries')S.openId=null;await delDoc(coll,id);return}
  if(d.add&&S.db){const kind=d.add,mid=S.mid;if(!mid)return;
    if(kind==='client'||kind==='relationship')await setDoc('entries',mid+'_'+uid(),{meetingId:mid,kind,order:nextOrder(S.entries.filter(x=>x.kind===kind)),name:'New '+kind,owner:'',headline:'',brief:'',meetings:'None found.',emails:'None found.',urgency:'normal',health:'moving'});
    if(kind==='log')await setDoc('log',mid+'_'+uid(),{meetingId:mid,order:nextOrder(S.log),when:'',meeting:'',attendees:'',outcome:''});
    if(kind==='waiting')await setDoc('waiting',mid+'_'+uid(),{meetingId:mid,order:nextOrder(S.waiting),item:'',who:'',source:''});
    if(kind==='audit')await setDoc('audit',mid+'_'+uid(),{meetingId:mid,order:nextOrder(S.audit),party:'New item',subject:'',owner:'',ownerKey:'',status:'noreply',ageDays:0,inbound:'',done:'',next:'',links:[]});
    return}
});
$('#overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeSheet()});
document.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(e.key==='Escape'&&S.openId){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.entry&&document.activeElement.tagName==='ARTICLE'){e.preventDefault();openEntry(document.activeElement.dataset.entry);return}
  if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  if(S.openId&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const i=S.vis.indexOf(S.openId)+(e.key==='ArrowRight'?1:-1);if(S.vis[i]){S.openId=S.vis[i];renderSheet();$('#overlay').scrollTop=0}return}
  if((e.key==='p'||e.key==='P')&&!e.metaKey&&!e.ctrlKey&&!S.openId&&S.isAdmin)togglePresent();
});
document.addEventListener('change',e=>{
  const t=e.target;if(!S.db)return;
  if(t.id==='notewho'){S.who=t.value;store.set('br.who',t.value);return}
  if(t.dataset&&t.dataset.note){saveNote(t.dataset.note);return}
  if(!t.dataset||!t.dataset.coll)return;
  let v=t.value;if(t.dataset.kind==='src')v=parseSrc(v);if(t.dataset.field==='link')v=safeUrl(v);if(t.dataset.num)v=Number(v)||0;
  const d={[t.dataset.field]:v};
  if(t.dataset.coll==='questions'&&t.dataset.field==='answer')d.status=t.value.trim()?'answered':'open';
  upd(t.dataset.coll,t.dataset.id,d);
});
$('#mpick').addEventListener('change',e=>selectMeeting(e.target.value));
$('#bEdit').addEventListener('click',()=>{S.edit=!S.edit;S.confirm=null;renderAll()});
$('#bPresent').addEventListener('click',togglePresent);
function togglePresent(){S.present=!S.present;if(S.present)S.edit=false;renderAll()}
$('#qform').addEventListener('submit',async e=>{
  e.preventDefault();const m=cur();if(!S.db||!m)return;
  const text=$('#qtext').value.trim();if(!text){$('#qmsg').textContent='Type a question first.';return}
  const who=$('#qwho').value;S.who=who;store.set('br.who',who);$('#qadd').disabled=true;
  try{await S.db.collection('questions').add({meetingId:m.id,who,topic:$('#qtopic').value.trim(),text,answer:'',status:'open',createdAt:Date.now(),late:!!(m.questionsDue&&Date.now()>new Date(m.questionsDue).getTime())});
    $('#qtext').value='';$('#qmsg').textContent='Added. You can add another.';$('#qtext').focus()}
  catch(err){$('#qmsg').textContent='Not saved: '+(err&&err.message||'try again')}
  $('#qadd').disabled=false;
});
function fromHash(){const h=location.hash.slice(1);const t=LEGACY[h]||h;return TABS.includes(t)?t:null}
window.addEventListener('hashchange',()=>{const t=fromHash();if(t){S.tab=t;renderAll()}});
setInterval(()=>{if(cur()&&cur().questionsDue)renderHero()},60000);

/* ---------- boot ---------- */
(async function(){
  const h=fromHash();if(h)S.tab=h;
  renderAll();
  let user=null;try{user=await claude.use('user')}catch(e){}
  if(user){try{const w=await user.can('data.write');S.canWrite=w!==false}catch(e){}
    try{S.canAnswer=!!(await user.can('questions.answer'))}catch(e){}
    try{S.isAdmin=!!(await user.can('admin'))}catch(e){}
    try{const me=await user.me();const first=String(me&&me.name||'').split(' ')[0];if(!store.get('br.who')&&TEAM.includes(first))S.who=first}catch(e){}}
  let db=null;try{db=await claude.use('db')}catch(e){}
  S.db=db;
  if(!db){renderAll();return}
  db.collection('meetings').orderBy('date','desc').onSnapshot(s=>{
    S.meetings=s.docs.map(d=>({id:d.id,...d.data()}));
    const saved=store.get('br.mid');
    if(!S.mid||!S.meetings.some(m=>m.id===S.mid)){S.mid=S.meetings.some(m=>m.id===saved)?saved:(S.meetings[0]&&S.meetings[0].id)||null;watchMeeting()}
    else{const pm=prevMeeting();if((pm?pm.id:null)!==S.prevMid)watchMeeting()}
    renderSoon();
  },e=>toast('Could not load meetings ('+e.code+')'));
  db.collection('questions').onSnapshot(s=>{S.questions=s.docs.map(d=>({id:d.id,...d.data()}));renderSoon()},e=>toast('Could not load questions ('+e.code+')'));
})();
})();
</script>
